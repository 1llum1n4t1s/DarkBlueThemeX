# postinstall でネイティブビルドが必要な依存を明示許可（pnpm v10.12+ はここで管理）
allowBuilds:
  sharp: true
  spawn-sync: true

minimumReleaseAgeExclude:
  - '@kagayoi/support-extension@1.0.6'
  - adm-zip@0.6.1

# 脆弱性のある推移的依存を修正版へ引き上げる（いずれも web-ext 配下の devDependency）。
# 上流の web-ext / addons-linter が修正版を取り込んだらこの項目を削除する。
overrides:
  adm-zip: '>=0.6.1' # GHSA-vwc7-r8mq-g2x9: 展開先シンボリックリンク経由のファイル上書き
  brace-expansion: '>=5.0.8' # GHSA-mh99-v99m-4gvg: 無制限展開による OOM
  shell-quote: '>=1.8.5' # GHSA-395f-4hp3-45gv: parse() の二次計算量 DoS
  'fast-uri@3': '>=3.1.6 <4' # GHSA-5jgf-p345-68v8 ほか: URI 正規化によるホスト混同・SSRF
  'js-yaml@4': '>=4.3.2 <5' # GHSA-2883-xcg3-v3hh: 空の merge ソースによる CPU 消費
