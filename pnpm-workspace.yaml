# postinstall でネイティブビルドが必要な依存を明示許可（pnpm v10.12+ はここで管理）
allowBuilds:
  sharp: true
  spawn-sync: true

# 脆弱性のある推移的依存を修正版へ引き上げる（いずれも web-ext 配下の devDependency）。
# 上流の web-ext / addons-linter が修正版を取り込んだらこの項目を削除する。
overrides:
  adm-zip: '>=0.6.0' # GHSA: 細工 ZIP による 4GB メモリ確保
  brace-expansion: '>=5.0.8' # GHSA-mh99-v99m-4gvg: 無制限展開による OOM
  shell-quote: '>=1.8.5' # GHSA-395f-4hp3-45gv: parse() の二次計算量 DoS
  # fast-uri は上流 (ajv) が >=3.1.4 を要求するようになり override 不要になったため削除済み
