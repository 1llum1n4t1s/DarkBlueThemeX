name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]') }}
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify R2 transfer protocol offline
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Prepare native Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile 'package.json'
      - name: Install locked dependencies
        run: bun run deps
      - name: Test dependency security regressions
        run: bun --bun run test:dependencies
      - name: Validate 1
        run: bun --bun run sync:support --check
      - name: Validate 2
        run: bun --bun run check
      - name: Validate 3
        run: bun --bun run generate-icons
      - name: Validate 4
        run: bash zip.sh both
      - name: Validate 5
        run: |
          unzip -q DarkBlueThemeX-firefox.xpi -d firefox-validation
          bun --bun run web-ext lint --source-dir firefox-validation
