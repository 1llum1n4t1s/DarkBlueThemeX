name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate 1
        run: pnpm run sync:support --check
      - name: Validate 2
        run: pnpm run check
      - name: Validate 3
        run: pnpm run generate-icons
      - name: Validate 4
        run: bash zip.sh both
      - name: Validate 5
        run: |
          unzip -q DarkBlueThemeX-firefox.xpi -d firefox-validation
          pnpm exec web-ext lint --source-dir firefox-validation
