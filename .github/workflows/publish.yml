name: Publish to Chrome Web Store + Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

# release/** への連続 push 時に publish が並走して CWS の --auto-publish が競合しないよう直列化。
# publish ジョブはストアへの upload/submit という不可逆な外部副作用を持つため、進行中のランは
# キャンセルせずキューイングする (cancel-in-progress: false)。中断による部分公開を避ける。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 拡張機能パッケージ作成
    runs-on: ubuntu-latest
    steps:
      # Dependabot (.github/dependabot.yml) が actions の更新 PR を作成する。
      # actions/* は commit SHA 固定済み（サプライチェーン対策）。# vN コメントを手掛かりに Dependabot が SHA を追従更新する。
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: バージョンを取得
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 11

      - name: Node セットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール（lockfile 厳密モード）
        run: pnpm install --frozen-lockfile

      - name: package.json / manifest.json / manifest.firefox.json の version 同期確認
        run: pnpm run check-version

      - name: 共有リテラル (STORAGE_KEY / MSG_GET_STATE) の content↔popup 一致確認
        run: pnpm run check-shared-literals

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: Chrome + Firefox 両方のパッケージを作成（zip.sh 単一定義を使用）
        run: bash zip.sh both

      - name: Chrome ZIP artifact を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: darkbluethemex-chrome
          path: DarkBlueThemeX-chrome.zip
          if-no-files-found: error

      - name: Firefox XPI artifact を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: darkbluethemex-firefox
          path: DarkBlueThemeX-firefox.xpi
          if-no-files-found: error

  publish-chrome:
    name: Chrome Web Store にアップロード & 公開
    runs-on: ubuntu-latest
    needs: package
    # Secrets (CWS_*) を扱うジョブは最小権限を明示し、トップレベル変更からの独立性を確保。
    permissions:
      contents: read
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 11

      - name: Node セットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール（lockfile 厳密モード）
        run: pnpm install --frozen-lockfile

      - name: Chrome ZIP artifact を取得
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: darkbluethemex-chrome
          path: .

      - name: Chrome Web Store にアップロード & 公開
        env:
          # v4 は CLI が CLIENT_ID / CLIENT_SECRET / REFRESH_TOKEN / PUBLISHER_ID 環境変数を直接読む
          # (v3 の secret フラグは廃止)。GitHub Secrets 名は CWS_ プレフィックスのまま CLI 期待名に alias。
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        # devDependencies 固定バージョンの chrome-webstore-upload-cli v4.0.1 を使用 (CWS API v2)。
        # v4 は PUBLISHER_ID が新規必須 (CWS Developer Dashboard の Settings で確認)。
        # (pnpm dlx で毎回 latest を取得する方式はサプライチェーン攻撃の露出面が大きいため廃止)
        run: |
          # Firefox ジョブと対称の事前ガード: Secrets 欠落時に CLI の不透明なエラーではなく
          # 一行目で「どの Secret が未設定か」を明示して fail-fast する。
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ] || [ -z "$PUBLISHER_ID" ] || [ -z "$EXTENSION_ID" ]; then
            echo "::error::CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN / CWS_PUBLISHER_ID / CWS_EXTENSION_ID の GitHub Secrets が未設定です"
            echo "  v4 は CWS_PUBLISHER_ID が新規必須 (CWS Developer Dashboard の Settings で確認 → gh secret set CWS_PUBLISHER_ID)"
            exit 1
          fi
          # v4: サブコマンド無しのデフォルトコマンドで upload + publish (--auto-publish は廃止)。
          ./node_modules/.bin/chrome-webstore-upload \
            --source DarkBlueThemeX-chrome.zip \
            --extension-id "$EXTENSION_ID"
          echo "🎉 Chrome Web Store への公開リクエストを送信したよ〜"

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: ubuntu-latest
    needs: package
    # publish-firefox は package のみに依存し publish-chrome には依存しないため、Chrome publish が
    # 失敗 (同 version 重複 upload 等) しても Firefox AMO は独立して submit される (sibling job の失敗は波及しない)。
    # 一方 package ジョブの検証 (check-version / check-shared-literals) 失敗時は両ストアへの公開を止めたいので、
    # if: success() || failure() は付けず、既定の「package 成功時のみ実行」ゲートに委ねる
    # (以前の if は「Chrome 失敗 → firefox skip」という誤った想定で付与されていた)。
    # Secrets (AMO_*) を扱うジョブは最小権限を明示し、トップレベル変更からの独立性を確保。
    permissions:
      contents: read
    steps:
      - name: リポジトリをチェックアウト
        # web-ext は devDependencies なので package.json + lockfile が必要 (pnpm install で取得)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: pnpm セットアップ
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 11

      - name: Node セットアップ
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 依存インストール（lockfile 厳密モード）
        run: pnpm install --frozen-lockfile

      - name: アイコン生成
        run: node scripts/generate-icons.js

      - name: Firefox 用ソースディレクトリを構築
        # manifest.firefox.json を manifest.json として配置し、icons / src を同梱。
        # web-ext sign は source-dir を受け取って自身で xpi を構築するため、
        # ここでは zip 化せず source dir のまま渡す (二度手間の zip 化を避ける)。
        run: |
          mkdir -p firefox-build
          cp manifest.firefox.json firefox-build/manifest.json
          cp -r icons firefox-build/
          cp -r src firefox-build/
          find firefox-build \( -name "*.DS_Store" -o -name "*.swp" -o -name "*~" \) -delete
          echo "📂 firefox-build 内容:"
          ls -la firefox-build/

      - name: Firefox AMO に submit (web-ext sign --channel=listed)
        # web-ext 10+ では submission API がデフォルト動作 (`--use-submission-api` フラグは廃止)。
        # `--channel=listed` で AMO 公開 (人間レビュー入り)、submission 受付完了で job 成功扱い。
        # 実際のストア反映はレビュー通過後 (通常 1〜数日)、メール通知あり。
        env:
          # AMO API キー (JWT issuer / secret)
          # GitHub Secrets に設定: `gh secret set AMO_JWT_ISSUER` / `gh secret set AMO_JWT_SECRET`
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::AMO_JWT_ISSUER / AMO_JWT_SECRET の GitHub Secrets が未設定です"
            echo "  JWT 発行: https://addons.mozilla.org/ja/developers/addon/api/key/"
            echo "  登録: gh secret set AMO_JWT_ISSUER / gh secret set AMO_JWT_SECRET"
            exit 1
          fi
          # pnpm exec で pnpm-lock.yaml integrity 検証済みのローカル版を呼ぶ (Chrome 側と同じ
          # サプライチェーン方針)。--source-dir は事前に構築した firefox-build/。
          # --amo-metadata=.amo-metadata.json で version.license: "MIT" を毎回 submission に含める
          # (AMO API v5 仕様: 各 version 提出時に license 明示必須、過去 version からの継承なし)。
          #
          # `web-ext sign --channel=listed` は AMO の auto-sign を待たずに 15 分で timeout exceeded を
          # 返して exit 1 になる既知挙動がある。submission 自体は受理済みなので、timeout exceeded を
          # 検出したら warning 扱いで exit 0 に書き換えて CI を green 化する。
          # それ以外の exit 1 はそのまま fail。
          set +e
          pnpm exec web-ext sign \
            --source-dir=firefox-build \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --amo-metadata=.amo-metadata.json 2>&1 | tee /tmp/web-ext.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q "Approval: timeout exceeded" /tmp/web-ext.log; then
              echo "::warning::web-ext sign が timeout exceeded で exit 1 を返したが submission は AMO に受理済み (既知挙動)。CI green 化のため exit 0 扱いに変換します"
            elif grep -qE "Version .* already exists\.|Submission failed \([0-9]+\): Conflict" /tmp/web-ext.log; then
              echo "::warning::AMO に同 version の submission が既に存在する (Chrome 側修正のための同 version 再 push 時に発生する想定挙動)。CI green 化のため exit 0 扱いに変換します"
            else
              echo "::error::web-ext sign が timeout exceeded / 同 version 重複以外の理由で失敗しました (rc=$rc)。ログ確認要"
              exit "$rc"
            fi
          fi
          echo "🦊 Firefox AMO への submission 送信完了 (レビュー待ち)"
          echo "🔗 AMO Developer Hub: https://addons.mozilla.org/developers/"
          echo "⏰ レビュー結果は通常 1〜数日でメール通知"
