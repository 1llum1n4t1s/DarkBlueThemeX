name: Publish to Chrome Web Store + Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

# release/** への連続 push 時に publish が並走して CWS の --auto-publish が競合しないよう直列化。
# publish ジョブはストアへの upload/submit という不可逆な外部副作用を持つため、進行中のランは
# キャンセルせずキューイングする (cancel-in-progress: false)。中断による部分公開を避ける。
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  package:
    name: 拡張機能パッケージ作成
    runs-on: ubuntu-latest
    outputs:
      chrome-sha256: ${{ steps.verify-artifacts.outputs.chrome-sha256 }}
      artifact-attempt: ${{ steps.artifact-identity.outputs.attempt }}
    steps:
      - name: Record native artifact producer attempt
        id: artifact-identity
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: Prepare native Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile 'package.json'

      - name: バージョンを取得
        id: version
        run: |
          version=$(bun -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: 依存インストール（lockfile 厳密モード）
        run: bun run deps
      - name: Test dependency security regressions
        run: bun --bun run test:dependencies

      - name: 問い合わせ共通部品の同期を確認
        run: bun --bun run sync:support --check

      - name: version・共有リテラル・問い合わせ権限・テーマ復元契約を確認
        run: bun --bun run check

      - name: アイコン生成
        run: bun scripts/generate-icons.js

      - name: Chrome + Firefox 両方のパッケージを作成（zip.sh 単一定義を使用）
        run: bash zip.sh both

      - name: 提出予定の ZIP / XPI の版・構成・内容・SHA256 を照合
        id: verify-artifacts
        run: |
          set -euo pipefail
          python3 scripts/verify-release-artifact.py chrome DarkBlueThemeX-chrome.zip | tee release-verification-chrome.json
          python3 scripts/verify-release-artifact.py firefox DarkBlueThemeX-firefox.xpi | tee release-verification-firefox.json
          echo "chrome-sha256=$(python3 -c 'import json; print(json.load(open("release-verification-chrome.json"))["archive_sha256"])')" >> "$GITHUB_OUTPUT"

      - name: 配布物の照合記録を保存
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'darkbluethemex-package-verification' -Path @('release-verification-*.json') | Out-Null

      - name: Chrome ZIP artifact を保存
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'darkbluethemex-chrome' -Path @('DarkBlueThemeX-chrome.zip') | Out-Null

      - name: Firefox XPI artifact を保存
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'darkbluethemex-firefox' -Path @('DarkBlueThemeX-firefox.xpi') | Out-Null

  publish-chrome:
    name: Chrome Web Store にアップロード & 公開
    runs-on: ubuntu-latest
    needs: package
    # Secrets (CWS_*) を扱うジョブは最小権限を明示し、トップレベル変更からの独立性を確保。
    permissions:
      contents: read
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: Chrome ZIP artifact を取得
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'darkbluethemex-chrome' -Destination '.' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: Chrome Web Store にアップロード & 公開
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "DarkBlueThemeX-chrome.zip" -ExpectedSha256 "${{ needs.package.outputs.chrome-sha256 }}"

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: ubuntu-latest
    needs: package
    # publish-firefox は package のみに依存し publish-chrome には依存しないため、Chrome publish が
    # 失敗 (同 version 重複 upload 等) しても Firefox AMO は独立して submit される (sibling job の失敗は波及しない)。
    # 一方 package ジョブの検証 (check-version / check-shared-literals) 失敗時は両ストアへの公開を止めたいので、
    # if: success() || failure() は付けず、既定の「package 成功時のみ実行」ゲートに委ねる
    # (以前の if は「Chrome 失敗 → firefox skip」という誤った想定で付与されていた)。
    # Secrets (AMO_*) を扱うジョブは最小権限を明示し、トップレベル変更からの独立性を確保。
    permissions:
      contents: read
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: Prepare native Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile 'package.json'

      - name: 依存インストール（lockfile 厳密モード）
        run: bun run deps
      - name: Test dependency security regressions
        run: bun --bun run test:dependencies

      - name: Firefox XPI artifact を取得
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'darkbluethemex-firefox' -Destination '.' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: Firefox XPI から提出用ソースを展開
        # package ジョブで選択・検証した manifest / icons / src をそのまま使用する。
        run: |
          unzip -q DarkBlueThemeX-firefox.xpi -d firefox-build
          echo "📂 firefox-build 内容:"
          ls -la firefox-build/

      - name: 正本のアイコンを package ジョブと同じ入力から生成
        # 生成 PNG は Git 管理外。再包装後も同じ checkout の src / icons と照合する。
        run: bun scripts/generate-icons.js

      - name: Firefox AMO に HTTP submission
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # オフラインfixtureのプロキシに PowerShell 自身のテレメトリを混ぜない。
          POWERSHELL_TELEMETRY_OPTOUT=1 pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
          test ! -e firefox-build/.amo-upload-uuid
          mkdir -p web-ext-artifacts
          ARCHIVE="$GITHUB_WORKSPACE/web-ext-artifacts/unsigned-submission.xpi"
          test ! -e "$ARCHIVE"
          pwsh -NoProfile -File scripts/Test-FirefoxArchive.ps1 -WorkDirectory "$RUNNER_TEMP/firefox-archive-tests"
          pwsh -NoProfile -File scripts/New-FirefoxArchive.ps1 -SourceDirectory firefox-build -Archive "$ARCHIVE" > web-ext-artifacts/build-receipt.json
          VERSION=$(python3 -c 'import json; print(json.load(open("firefox-build/manifest.json"))["version"])')
          ADDON_ID=$(python3 -c 'import json; m=json.load(open("firefox-build/manifest.json")); print(m.get("browser_specific_settings",m.get("applications",{}))["gecko"]["id"])')
          python3 scripts/verify-release-artifact.py firefox "$ARCHIVE" > web-ext-artifacts/unsigned-submission-verification.json
          SHA256=$(python3 -c 'import json; print(json.load(open("web-ext-artifacts/unsigned-submission-verification.json"))["archive_sha256"])')
          pwsh -NoProfile -File scripts/Publish-Amo.ps1 -Archive "$ARCHIVE" -Metadata .amo-metadata.json -AddonId "$ADDON_ID" -ExpectedVersion "$VERSION" -ExpectedSha256 "$SHA256"

      - name: AMO に提出した未署名 XPI と照合記録を保存
        if: always()
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          $available = @('web-ext-artifacts/unsigned-submission.xpi','web-ext-artifacts/unsigned-submission-verification.json') | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if (@($available).Count) {
            Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'darkbluethemex-firefox-submission' -Path @($available) | Out-Null
          } else { Write-Warning 'No AMO submission evidence was produced' }
